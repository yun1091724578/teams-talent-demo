schemaVersion: 1
id: icode-miner-diff
name: 开发范式挖掘（代码片段）
description: 分析本地代码片段并结合代码仓上下文，总结开发范式，归档到仓库的 .icode-knowledge/miner/
definitionVersion: "0.1.0"

input:
  repositories:
    type: array
    items:
      type: repository
    required: true
    minItems: 1
    maxItems: 1
  scenario:
    type: string
    required: true
  snippets:
    type: array
    items:
      type: string
    required: true
  summaryTemplate:
    type: string

output:
  miner:
    relativeTo: repository
    path: .icode-knowledge/miner

build:
  skill:
    name: icode-miner-diff
    defaultPrompt: |
      总结代码仓库“${repository.name}”中所给代码片段体现的开发范式。

      运行准备脚本时传入输入文件：${inputFile.path}。脚本会列出本次的全部输入、输出位置和规则，之后按它的输出进行。
